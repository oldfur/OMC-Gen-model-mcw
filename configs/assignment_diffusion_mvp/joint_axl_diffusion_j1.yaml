joint_j1:
  enabled: true
  fixed_sample_id: RHODIN01|4|gener|9b810e76ec9d286
  fixed_sample_path: outputs/assignment_diffusion_mvp/d1_fixed_clean_geometry/fixed_sample.pt
  automorphism_orbits_path: outputs/assignment_diffusion_mvp/role_automorphism_audit/role_orbits.json
  output_dir: outputs/assignment_diffusion_mvp/joint_axl_diffusion_j1

  gemnet:
    model_path: /public/home/lmy/mattergen_omc25/outputs/singlerun/2026-06-03/le50_molcsp_scratch_mean_cell025_bondhuber_lowt04_posonly_w1e-3_8gpu01234567
    load_epoch: 294
    checkpoint_path: /public/home/lmy/mattergen_omc25/outputs/singlerun/2026-06-03/le50_molcsp_scratch_mean_cell025_bondhuber_lowt04_posonly_w1e-3_8gpu01234567/lightning_logs/version_0/checkpoints/epoch=294-loss_val=0.04.ckpt

  # J1.1: compact sin² mobility windows, ∫β=κ
  schedule:
    r_window: [0.60, 0.95]
    g_window: [0.35, 0.75]
    kappa_r: 4.0
    kappa_g: 6.0

  # J1.3-A: G teacher (historical | improvement_weighted)
  g_supervision: improvement_weighted
  g_teacher_temperature: 0.02
  # J1.3-B: mean | orbit_slot | orbit_slot_geometry | template_counterfactual
  g_copy_context_mode: template_counterfactual
  # B3 detach=true | B4 coupled mirror: false (only experimental variable)
  g_relation_detach_trunk: false

  loss:
    lambda_r: 1.0
    lambda_g: 1.0

  optim:
    lr_pretrained: 1.0e-5
    lr_new: 1.0e-4
    weight_decay: 1.0e-4
    gradient_clip_norm: 1.0

  steps: 1000
  seed: 17
  log_every_steps: 20
  device: auto
  limit_density: 0.05

  evaluation:
    timesteps: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.0]
    seeds: [0, 1, 2, 3]
    # sampling controls: ctmc_A (default) and static_A (A fixed at prior)
    assignment_modes: [ctmc_A, static_A]
    num_samples_per_mode: 4
    reverse_eval:
      seeds: [101, 102, 103, 104, 105, 106, 107, 108]
