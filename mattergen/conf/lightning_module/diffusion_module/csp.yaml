_target_: mattergen.diffusion.diffusion_module.DiffusionModule
assignment_diffusion_enabled: false
assignment_latent_mode: none
role_partition_diffusion_type: discrete_constrained
role_diffusion_type: masked_capacity
matching_diffusion_type: masked_permutation
role_context_mode: geometry_only
global_copy_assembly:
  enabled: false
assignment_diffusion_loss_weight: 1.0
assignment_diffusion_steps: 1000
assignment_clean_logit_scale: 8.0
assignment_sinkhorn_tau_max: 1.0
assignment_sinkhorn_tau_min: 0.10
assignment_sinkhorn_max_iter: 300
assignment_sinkhorn_tol: 1.0e-6
assignment_prediction_type: epsilon
model: mattergen
corruption: csp

loss_fn:
  _target_: mattergen.common.loss.MaterialsLoss
  reduce: sum
  include_pos: True
  include_cell: True
  include_atomic_numbers: False
  weights:
    cell: 1.0
    pos: 0.1


pre_corruption_fn:
  _target_: mattergen.property_embeddings.SetEmbeddingType
  p_unconditional: 0.2
  dropout_fields_iid: false
